name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # `secrets` can't be referenced directly in `if:` — GitHub disallows it.
      # Stash whether it's set in a step output instead, and branch on that.
      - name: Check for signing certificate secret
        id: cert_check
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$MACOS_CERT_P12" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # If the repo secrets aren't set up, this step is skipped and build.sh
      # falls back to generating its own throwaway certificate — the build
      # still succeeds, it just won't share a stable identity with local
      # builds (see setup-ci-cert.sh).
      - name: Import stable signing certificate
        if: steps.cert_check.outputs.present == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          EXISTING=$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')
          security list-keychains -d user -s build.keychain $EXISTING
          security default-keychain -s build.keychain

          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG
        run: ./make-dmg.sh

      - name: Compute version tag
        id: version
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: build/StkhMonitor.dmg
          generate_release_notes: true
